<dl class="hp-qa">
  <dt>売り場の追加</dt><dd>［追加］で販売場所を選び、宛名と手数料率を入れて［更新］。出すのをやめるときは「出す」をOFF（宛名・率は残る）</dd>
  <dt>宛名</dt><dd>「御中」は自動で付く</dd>
  <dt>手数料率</dt><dd>開始月の1日から適用。小数は1桁まで。変えるときは新しい開始月で追加。開始前の率だけ取消できる。発行済みの計算書は変わらない</dd>
  <dt>サービス：売上に反映する</dt><dd>ON＝日計表のサービス販売（社員割引など）の値引きを総売上から引く。計算書にはサービス名の列が出る</dd>
</dl>
