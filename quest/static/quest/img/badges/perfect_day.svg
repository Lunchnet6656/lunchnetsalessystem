<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" shape-rendering="crispEdges">
  <!-- 王冠 -->
  <!-- 王冠の下部（台座） -->
  <rect x="6" y="34" width="36" height="8" fill="#ffd700"/>
  <rect x="4" y="36" width="40" height="6" fill="#ffd700"/>
  <!-- 王冠の縁取り -->
  <rect x="4" y="36" width="40" height="2" fill="#c5a600"/>
  <rect x="4" y="40" width="40" height="2" fill="#c5a600"/>
  <!-- 王冠の歯（5本） -->
  <!-- 左端の歯 -->
  <rect x="6" y="20" width="6" height="16" fill="#ffd700"/>
  <!-- 左の歯 -->
  <rect x="14" y="24" width="6" height="12" fill="#ffd700"/>
  <!-- 中央の歯（最高） -->
  <rect x="21" y="12" width="6" height="24" fill="#ffd700"/>
  <!-- 右の歯 -->
  <rect x="28" y="24" width="6" height="12" fill="#ffd700"/>
  <!-- 右端の歯 -->
  <rect x="36" y="20" width="6" height="16" fill="#ffd700"/>
  <!-- 歯の間 -->
  <rect x="12" y="32" width="4" height="4" fill="#ffd700"/>
  <rect x="20" y="32" width="2" height="4" fill="#ffd700"/>
  <rect x="26" y="32" width="2" height="4" fill="#ffd700"/>
  <rect x="34" y="32" width="4" height="4" fill="#ffd700"/>
  <!-- 宝石装飾 -->
  <!-- 左端 -->
  <rect x="7" y="22" width="4" height="4" fill="#e53935"/>
  <!-- 左 -->
  <rect x="15" y="26" width="4" height="4" fill="#1565c0"/>
  <!-- 中央（大宝石） -->
  <rect x="21" y="14" width="6" height="6" fill="#e91e63"/>
  <rect x="22" y="15" width="4" height="4" fill="#f48fb1"/>
  <!-- 右 -->
  <rect x="29" y="26" width="4" height="4" fill="#1565c0"/>
  <!-- 右端 -->
  <rect x="37" y="22" width="4" height="4" fill="#e53935"/>
  <!-- 台座の宝石 -->
  <rect x="22" y="37" width="4" height="4" fill="#ffd700" opacity="0.7"/>
  <!-- 縁の金装飾 -->
  <rect x="6" y="34" width="36" height="2" fill="#c5a600"/>
  <!-- 王冠縁 -->
  <rect x="6" y="20" width="36" height="2" fill="#c5a600"/>
  <!-- ハイライト -->
  <rect x="6" y="20" width="3" height="16" fill="#ffed4a" opacity="0.4"/>
  <rect x="21" y="12" width="3" height="24" fill="#ffed4a" opacity="0.4"/>
</svg>
