<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" shape-rendering="crispEdges">
  <!-- 虹炎（30日連続） -->
  <!-- 外炎（赤） -->
  <rect x="16" y="2" width="16" height="4" fill="#e53935"/>
  <rect x="12" y="4" width="24" height="4" fill="#e53935"/>
  <rect x="8" y="6" width="32" height="6" fill="#e53935"/>
  <!-- オレンジ層 -->
  <rect x="6" y="10" width="36" height="6" fill="#ff9800"/>
  <!-- 黄色層 -->
  <rect x="6" y="14" width="36" height="6" fill="#ffd700"/>
  <!-- 緑層 -->
  <rect x="6" y="18" width="36" height="6" fill="#4caf50"/>
  <!-- 青層 -->
  <rect x="6" y="22" width="36" height="6" fill="#1976d2"/>
  <!-- 紫層 -->
  <rect x="8" y="26" width="32" height="6" fill="#7b1fa2"/>
  <!-- ピンク層 -->
  <rect x="10" y="30" width="28" height="6" fill="#e91e63"/>
  <!-- 収束 -->
  <rect x="12" y="34" width="24" height="6" fill="#ffd700"/>
  <rect x="16" y="38" width="16" height="4" fill="#ffd700"/>
  <!-- 中心の輝き -->
  <rect x="20" y="18" width="8" height="12" fill="#ffffff" opacity="0.8"/>
  <rect x="22" y="16" width="4" height="16" fill="#ffffff" opacity="0.8"/>
  <!-- 「30」 -->
  <rect x="20" y="22" width="8" height="2" fill="#ffd700"/>
</svg>
