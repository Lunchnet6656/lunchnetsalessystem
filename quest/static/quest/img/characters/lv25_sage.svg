<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- 光のオーラ（背景） -->
  <rect x="4" y="4" width="8" height="8" fill="#fff59d" opacity="0.3"/>
  <rect x="52" y="4" width="8" height="8" fill="#fff59d" opacity="0.3"/>
  <rect x="0" y="28" width="8" height="8" fill="#fff59d" opacity="0.2"/>
  <rect x="56" y="28" width="8" height="8" fill="#fff59d" opacity="0.2"/>
  <!-- 賢者の帽子 -->
  <rect x="24" y="0" width="16" height="4" fill="#e8eaf6"/>
  <rect x="22" y="3" width="20" height="4" fill="#c5cae9"/>
  <rect x="16" y="6" width="32" height="4" fill="#9fa8da"/>
  <!-- 長い白髪 -->
  <rect x="14" y="10" width="6" height="20" fill="#f5f5f5"/>
  <rect x="44" y="10" width="6" height="20" fill="#f5f5f5"/>
  <!-- 頭 -->
  <rect x="20" y="10" width="24" height="18" fill="#f5c89a"/>
  <!-- 年老いた目（知恵の眼） -->
  <rect x="23" y="16" width="5" height="3" fill="#7986cb"/>
  <rect x="36" y="16" width="5" height="3" fill="#7986cb"/>
  <!-- 長いひげ（白） -->
  <rect x="22" y="24" width="20" height="6" fill="#f5f5f5"/>
  <rect x="24" y="30" width="4" height="10" fill="#f5f5f5"/>
  <rect x="30" y="30" width="4" height="8" fill="#f5f5f5"/>
  <rect x="36" y="30" width="4" height="10" fill="#f5f5f5"/>
  <!-- 賢者のローブ（白銀） -->
  <rect x="12" y="28" width="40" height="24" fill="#e8eaf6"/>
  <rect x="16" y="28" width="32" height="24" fill="#c5cae9"/>
  <!-- 金の縁取り -->
  <rect x="12" y="28" width="40" height="2" fill="#ffd700"/>
  <rect x="12" y="50" width="40" height="2" fill="#ffd700"/>
  <!-- 魔法陣の紋様 -->
  <rect x="24" y="32" width="16" height="16" fill="#e8eaf6" opacity="0.5"/>
  <rect x="28" y="34" width="8" height="12" fill="#9fa8da"/>
  <rect x="30" y="36" width="4" height="8" fill="#7986cb"/>
  <!-- 知恵の書 -->
  <rect x="48" y="28" width="14" height="18" fill="#f5f5f5"/>
  <rect x="49" y="29" width="12" height="16" fill="#fffde7"/>
  <rect x="50" y="31" width="10" height="2" fill="#9e9e9e"/>
  <rect x="50" y="34" width="10" height="2" fill="#9e9e9e"/>
  <rect x="50" y="37" width="10" height="2" fill="#9e9e9e"/>
  <rect x="50" y="40" width="6" height="2" fill="#9e9e9e"/>
  <rect x="48" y="28" width="3" height="18" fill="#f57f17"/>
  <!-- 腕 -->
  <rect x="6" y="28" width="8" height="20" fill="#e8eaf6"/>
  <!-- 手 -->
  <rect x="6" y="46" width="8" height="6" fill="#f5c89a"/>
  <rect x="48" y="46" width="8" height="6" fill="#f5c89a"/>
  <!-- 光の杖 -->
  <rect x="4" y="16" width="4" height="32" fill="#c5cae9"/>
  <!-- 杖の先端（光球） -->
  <rect x="2" y="10" width="8" height="8" fill="#ffd700"/>
  <rect x="4" y="8" width="4" height="12" fill="#ffd700"/>
  <rect x="0" y="12" width="12" height="4" fill="#ffd700"/>
  <!-- 光のきらめき -->
  <rect x="0" y="8" width="3" height="3" fill="#ffffff" opacity="0.9"/>
  <rect x="10" y="8" width="3" height="3" fill="#ffffff" opacity="0.9"/>
  <!-- 足 -->
  <rect x="20" y="52" width="10" height="8" fill="#9fa8da"/>
  <rect x="34" y="52" width="10" height="8" fill="#9fa8da"/>
  <rect x="18" y="57" width="14" height="4" fill="#7986cb"/>
  <rect x="32" y="57" width="14" height="4" fill="#7986cb"/>
</svg>
