<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- 頭 -->
  <rect x="20" y="8" width="24" height="18" fill="#f5c89a"/>
  <!-- フルヘルメット -->
  <rect x="18" y="2" width="28" height="10" fill="#455a64"/>
  <rect x="16" y="6" width="4" height="12" fill="#455a64"/>
  <rect x="44" y="6" width="4" height="12" fill="#455a64"/>
  <!-- バイザー -->
  <rect x="20" y="10" width="24" height="4" fill="#78909c"/>
  <!-- 目（バイザー越し） -->
  <rect x="24" y="12" width="5" height="2" fill="#4fc3f7"/>
  <rect x="35" y="12" width="5" height="2" fill="#4fc3f7"/>
  <!-- フル鎧 -->
  <rect x="12" y="26" width="40" height="22" fill="#455a64"/>
  <!-- 鎧の装飾 -->
  <rect x="16" y="26" width="32" height="4" fill="#546e7a"/>
  <rect x="22" y="30" width="20" height="14" fill="#546e7a"/>
  <!-- 紋章（弁当箱型の盾） -->
  <rect x="24" y="32" width="16" height="12" fill="#ffd700" opacity="0.9"/>
  <rect x="26" y="34" width="12" height="8" fill="#0d1b4a"/>
  <rect x="28" y="36" width="8" height="2" fill="#ffd700"/>
  <rect x="28" y="40" width="8" height="2" fill="#ffd700"/>
  <!-- 腕（鎧） -->
  <rect x="6" y="26" width="8" height="22" fill="#455a64"/>
  <rect x="50" y="26" width="8" height="22" fill="#455a64"/>
  <!-- 盾（弁当箱型） -->
  <rect x="2" y="28" width="12" height="16" fill="#1565c0"/>
  <rect x="4" y="30" width="8" height="12" fill="#1e88e5"/>
  <rect x="5" y="32" width="6" height="2" fill="#ffd700"/>
  <rect x="5" y="36" width="6" height="2" fill="#ffd700"/>
  <!-- 手 -->
  <rect x="6" y="46" width="8" height="4" fill="#f5c89a"/>
  <!-- 槍（おたま拡張） -->
  <rect x="54" y="20" width="4" height="28" fill="#5d4037"/>
  <rect x="52" y="14" width="8" height="8" fill="#b0bec5"/>
  <!-- 足（鎧） -->
  <rect x="18" y="48" width="12" height="12" fill="#37474f"/>
  <rect x="34" y="48" width="12" height="12" fill="#37474f"/>
  <rect x="16" y="56" width="16" height="4" fill="#212121"/>
  <rect x="32" y="56" width="16" height="4" fill="#212121"/>
</svg>
