<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- 大きな商人帽 -->
  <rect x="22" y="2" width="20" height="4" fill="#4e342e"/>
  <rect x="16" y="5" width="32" height="5" fill="#6d4c41"/>
  <!-- 羽根飾り -->
  <rect x="36" y="0" width="3" height="6" fill="#e53935"/>
  <rect x="39" y="1" width="4" height="4" fill="#e53935" opacity="0.7"/>
  <!-- 頭 -->
  <rect x="20" y="10" width="24" height="18" fill="#f5c89a"/>
  <!-- 立派なひげ（豪商） -->
  <rect x="22" y="20" width="20" height="6" fill="#8d6e63"/>
  <rect x="24" y="26" width="6" height="4" fill="#8d6e63"/>
  <rect x="34" y="26" width="6" height="4" fill="#8d6e63"/>
  <!-- 目（笑い目） -->
  <rect x="24" y="15" width="6" height="2" fill="#3e2723"/>
  <rect x="34" y="15" width="6" height="2" fill="#3e2723"/>
  <!-- 豪華なローブ -->
  <rect x="12" y="28" width="40" height="24" fill="#e65100"/>
  <rect x="16" y="28" width="32" height="24" fill="#f57c00"/>
  <!-- 金の縁取り -->
  <rect x="12" y="28" width="40" height="3" fill="#ffd700"/>
  <rect x="12" y="49" width="40" height="3" fill="#ffd700"/>
  <!-- 胸の装飾 -->
  <rect x="22" y="32" width="20" height="16" fill="#e65100"/>
  <rect x="24" y="34" width="16" height="12" fill="#bf360c"/>
  <!-- コイン模様 -->
  <rect x="28" y="36" width="8" height="8" fill="#ffd700"/>
  <rect x="30" y="38" width="4" height="4" fill="#f57f17"/>
  <!-- 腕 -->
  <rect x="6" y="28" width="8" height="20" fill="#e65100"/>
  <rect x="50" y="28" width="8" height="20" fill="#e65100"/>
  <!-- 手 -->
  <rect x="6" y="46" width="8" height="6" fill="#f5c89a"/>
  <!-- 宝箱 -->
  <rect x="50" y="38" width="14" height="10" fill="#5d4037"/>
  <rect x="50" y="38" width="14" height="5" fill="#8d6e63"/>
  <rect x="50" y="42" width="14" height="2" fill="#ffd700"/>
  <rect x="56" y="38" width="2" height="10" fill="#ffd700"/>
  <!-- 宝箱から輝き -->
  <rect x="52" y="34" width="3" height="4" fill="#ffd700" opacity="0.8"/>
  <rect x="57" y="32" width="3" height="4" fill="#ffd700" opacity="0.6"/>
  <rect x="62" y="35" width="3" height="3" fill="#ffd700" opacity="0.5"/>
  <!-- 足 -->
  <rect x="19" y="52" width="11" height="8" fill="#4e342e"/>
  <rect x="34" y="52" width="11" height="8" fill="#4e342e"/>
  <rect x="17" y="57" width="15" height="4" fill="#3e2723"/>
  <rect x="32" y="57" width="15" height="4" fill="#3e2723"/>
</svg>
