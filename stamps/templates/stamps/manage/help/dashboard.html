<dl class="hp-qa">
  <dt>この画面の用途</dt><dd>スタンプカードの参加率・来店数・ポイント到達率・特典と、LINE公式アカウントの友だち数を期間・店舗で集計。</dd>
  <dt>パイロットの判定</dt><dd>GO/NO-GO判定は、この画面と［分析］のCSVで行う。</dd>
  <dt>数値の更新タイミング</dt><dd>来店・特典＝スタンプ押印・特典使用の時点で反映。友だち・ブロック＝毎日1回自動取得（前日分まで）。</dd>
  <dt>店舗で絞り込んだとき</dt><dd>来店数・対象カード数・ポイント到達率・参加率の分子は店舗別。友だち数・参加率の分母・特典はアカウント全体の数。</dd>
  <dt>参加率が「—」のとき</dt><dd>友だち統計が未取得。翌日の自動取得後に表示。</dd>
</dl>
