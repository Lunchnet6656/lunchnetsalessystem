<dl class="hp-qa">
  <dt>この画面の用途</dt><dd>条件に合う会員へLINEメッセージを自動で1回送る設定。シナリオごとにON/OFF・文面・タイミング・対照群を保存。</dd>
  <dt>送信されないとき</dt><dd>LINE連携が未設定、またはシナリオが「停止中」。</dd>
  <dt>お礼メッセージ</dt><dd>感謝を伝えるだけで、来店を促す効果は見込まない。次回後押しのメッセージに統合してもよい。</dd>
  <dt>効果の見方</dt><dd>送信と対照の再来率を比較。対照群0%では比較できない。人数が少ないうちは偶然の差が出やすい。</dd>
</dl>
