<dl class="hp-qa">
  <dt>店舗の登録</dt><dd>店舗は販売場所一覧の登録をそのまま使用。この画面では追加しない。</dd>
  <dt>パイロットの対象店</dt><dd>スタンプを使う店舗だけ「スタンプ受付」をONにして保存。</dd>
  <dt>出店時間</dt><dd>空欄は全店共通の既定時間。製造中にも客が来る店舗（本店など）は個別に早めに設定できる。時間外はスタンプを受け付けない。</dd>
  <dt>POPの種類</dt><dd>宣伝POP＝A4縦1枚。卓上POP＝A5横に印刷し、中央の点線で切るとA6が2枚。柄は「QRのみ」と「NFC＋QR」。</dd>
  <dt>QR再発行</dt><dd>QRが外部に出回ったときに使用。再発行すると掲示中のQRは使えなくなるため、POPを印刷し直して貼り替える。</dd>
</dl>
