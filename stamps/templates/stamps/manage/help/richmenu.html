<dl class="hp-qa">
  <dt>仕組み</dt><dd>スタンプを始めた会員にだけスタンプ用メニューを表示。その他の友だちは通常のメニューのまま。LINE公式アカウントの管理画面では、会員ごとのメニュー切替はできない。</dd>
  <dt>費用</dt><dd>メニューの登録・適用はメッセージ通数を消費しない（追加費用なし）。</dd>
  <dt>手順</dt><dd>1. ［メニュー登録］で画像とリンク先を入力して登録。2. 新しい利用者には初回スタンプ時に自動で適用。3. 既存の利用者には［一括適用］。</dd>
  <dt>適用失敗のとき</dt><dd>LINEとの通信エラーなど。利用者一覧の行の［適用］で再実行。</dd>
</dl>
