<dl class="hp-qa">
  <dt>この画面の用途</dt><dd>来店記録からリピート・来店間隔・継続・離反を集計し、目標ラインで判定。</dd>
  <dt>判定の色</dt><dd>緑＝好調／橙＝ふつう／赤＝要注意／灰＝データ待ち。目標ラインは暫定値（運用しながら調整）。</dd>
  <dt>数字の読み方</dt><dd>来店記録の集計値。増減の原因（スタンプの効果など）は特定しない。</dd>
  <dt>前期比</dt><dd>直前の同じ日数の期間との差。</dd>
  <dt>要フォローの会員</dt><dd>［対象者を表示］で友だち管理の「離反ぎみ」に絞り込んで表示。</dd>
</dl>
