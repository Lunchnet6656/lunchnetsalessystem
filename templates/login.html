<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LSSログイン</title>
    {% load static %}
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="bg-dark text-light d-flex justify-content-center align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow-lg border-0">
                    <div class="card-body">
                        <div class="text-center mb-3">
                            <img src="{% static 'images/lunchnet-logo.png' %}" alt="ランチネット" class="login-logo">
                        </div>
                        <h2 class="text-center text-dark">ランチネット</h2>
                        <h2 class="text-center text-dark mb-4">販売実績管理システム(LSS)</h2>
                        <form method="POST" action="{% url 'login' %}" id="login-form">
                            {% if request.GET.next %}<input type="hidden" name="next" value="{{ request.GET.next }}">{% endif %}
                            {% csrf_token %}
                            <div class="form-group">
                                <label for="username" class="text-dark">ユーザー名</label>
                                <input type="text" name="username" id="username" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label for="password" class="text-dark">パスワード</label>
                                <input type="password" name="password" id="password" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary btn-block" id="login-button">ログイン</button>
                        </form>
                        {% if messages %}
                            <div class="mt-3">
                                <ul class="list-group">
                                    {% for message in messages %}
                                        <li class="list-group-item list-group-item-danger">{{ message }}</li>
                                    {% endfor %}
                                </ul>
                            </div>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Bootstrap JS and dependencies -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
    // 二度押し防止：1回目のログインで合言葉（CSRF）が新しくなるため、2回目の送信は必ず
    // 「期限切れ」で弾かれ、ログインできているのにエラー画面が出ていた（2026-10-16 新人の事例）。
    (function () {
        var form = document.getElementById('login-form');
        var button = document.getElementById('login-button');
        var sent = false;
        form.addEventListener('submit', function (e) {
            if (sent) { e.preventDefault(); return; }
            sent = true;
            button.textContent = 'ログインしています…';
            setTimeout(function () { button.disabled = true; }, 0);
        });
        // 戻るボタンでこの画面に戻ったときは、もう一度押せるように戻す
        window.addEventListener('pageshow', function (e) {
            if (e.persisted) { sent = false; button.disabled = false; button.textContent = 'ログイン'; }
        });
    })();
    </script>
</body>
</html>
