<button type="button" class="hp-tip-btn" popovertarget="hp-tip-{{ id }}{% if key %}-{{ key }}{% endif %}" aria-label="{{ label }}の説明"><span class="hp-i" aria-hidden="true">i</span></button><span id="hp-tip-{{ id }}{% if key %}-{{ key }}{% endif %}" class="hp-tip" popover><span class="hp-tip-text">{{ text }}</span><button type="button" class="hp-close" popovertarget="hp-tip-{{ id }}{% if key %}-{{ key }}{% endif %}" popovertargetaction="hide" aria-label="閉じる">×</button></span>
