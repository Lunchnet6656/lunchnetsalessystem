{% load custom_filters %}
{% load humanize %}
            <div class="col-md-9 mb-2">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span>サマリー(おかずのみ)</span>
                    </div>
                    <div class="card-body summary-section" style="margin-bottom: -40px; overflow: auto;"> <!-- 下側の余白を狭く設定 -->
                        <div class="summary-item">
                            <h5 class="card-title">総持参数</h5>
                            <p class="card-text summary-number">{{ total_quantity|intcomma }}</p>
                        </div>
                        <div class="summary-item">
                            <h5 class="card-title">総販売数</h5>
                            <p class="card-text summary-number">{{ total_sales_quantity|intcomma }}</p>
                        </div>
                        <div class="summary-item">
                            <h5 class="card-title">総残数</h5>
                            <p class="card-text summary-number">{{ total_remaining|intcomma }}</p>
                        </div>
                        <div class="summary-item">
                            <h5 class="card-title">廃棄率</h5>
                            <p class="card-text summary-number">{{ formatted_waste_rate }}</p>
                        </div>
                    </div>
                    <div class="card-body summary-section" style="padding: 0px; overflow: auto;"> <!-- paddingとマージンを狭く設定 -->
                        <div class="summary-item">
                            <h5 class="card-title">総売上</h5>
                            <p class="card-text summary-number">{{ total_revenue|yen_format }}</p>
                        </div>
                    </div>
                </div>
            </div>
