{% extends 'base.html' %}
{% block title %}確認：予定を取り消す{% endblock %}
{% block extra_css %}{% include "prices/_styles.html" %}{% endblock %}
{% block content %}
<div class="container mt-4" style="max-width:720px;">
    <h1 class="h3">確認：この予定を取り消しますか？</h1>
    <hr>
    <div class="pm-sentence mb-3"><p class="mb-0">「{{ item.label }}」の予定を取り消します。今の金額・欄のまま続きます。</p></div>
    <form method="POST">{% csrf_token %}
        <div class="d-flex gap-2 justify-content-end my-4">
            <a href="{% url 'discount_item_list' %}" class="btn btn-outline-secondary">戻る</a>
            <button class="btn btn-danger">取消</button>
        </div>
    </form>
</div>
{% endblock %}
